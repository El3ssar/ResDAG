# Pull-request gate: lint + type-check + tests, via the reusable _test.yml
# workflow (shared with release.yml). (Docs build correctness is checked by
# docs.yml, which also runs on pull requests.)
#
# Tests are SELECTIVE on pull requests: `tools/affected_tests.py` diffs the PR
# against its base and runs only the test files that the change can affect, via
# a static first-party import graph (see that script's docstring). This turns a
# ~4-minute full run into seconds for a typical single-module PR.
#
# Safety nets — selection is never the last line of defence before a release:
#   * The FULL suite runs on every push to main (release.yml) and nightly here.
#   * Broad-impact changes (pyproject, conftest, package __init__, the selector
#     itself, ...) force a full run; the selector fails safe to "run everything".
#   * Add the `ci-full` label to a PR to force a full run on demand.
#
# Coverage (full runs only) is computed, gated by a `fail_under` floor, and
# uploaded to Codecov by _test.yml.
#
# The CPU benchmark lane guards the performance regressions the fast paths were
# built to prevent (#263). It runs nightly, on manual dispatch, and on any PR
# carrying the `benchmark` label. It gates on the committed floors in
# `benchmarks/targets.json` (via `pytest -m benchmark`) and re-renders + uploads
# `benchmarks/results/REPORT.md` as a build artifact. See `benchmarks/README.md`.

name: CI

on:
  pull_request:
    branches: [main]
    # ci-full / benchmark labels are live controls, including when added after
    # the initial run. GitHub's default pull_request types omit label changes.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    # Nightly full-suite safety net (04:17 UTC) — catches any selection gap or
    # environment drift that a PR's selective run could have missed.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      dependency-mode:
        description: Dependency environment for tests (benchmarks retain the locked baseline)
        type: choice
        options: [locked, latest]
        default: locked

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.dependency-mode || 'locked' }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/_test.yml
    with:
      # Anything that is not a PR (nightly schedule, manual dispatch), or a PR
      # carrying the `ci-full` label, runs the whole suite with coverage.
      force-full: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-full') }}
      dependency-mode: ${{ github.event_name == 'workflow_dispatch' && inputs.dependency-mode || 'locked' }}
      base-sha: ${{ github.event.pull_request.base.sha }}
    secrets: inherit

  benchmark:
    # CPU performance-regression lane — runs nightly, on manual dispatch, and on
    # any PR labelled `benchmark` (so a PR touching a fast path can opt in to the
    # gate on demand without waiting for the nightly run). `-m benchmark` runs the
    # performance assertions deselected by default; the internal-ratio gates in
    # tests/test_benchmarks (gated on benchmarks/targets.json) and the CPU
    # benchmarks in tests/test_performance run here, while the @gpu ones auto-skip
    # without CUDA.
    if: >-
      ${{ github.event_name == 'schedule'
          || github.event_name == 'workflow_dispatch'
          || (github.event_name == 'pull_request'
              && contains(github.event.pull_request.labels.*.name, 'benchmark')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-environment
        with:
          python-version: "3.12"

      - name: Benchmarks (CPU) — gate on benchmarks/targets.json
        run: pytest -m benchmark --no-cov -q tests/test_benchmarks tests/test_performance

      - name: Install pinned optional Python comparison dependency
        run: python -m pip install -r benchmarks/requirements.txt

      - name: Check comparison windows and real Python adapters
        run: pytest --no-cov -q tests/test_benchmark_protocol.py tests/test_benchmark_budget.py

      - name: Render held-out Python comparison smoke report
        # This bounded run verifies both real Python adapters and the reporting
        # pipeline. It is one seed at untuned settings, not a ranking or an
        # equal-budget search. Julia has a separate optional protocol job below.
        # Existing internal timing gates run before installing comparison deps.
        working-directory: benchmarks
        run: python -m rc_bench.run --quick --only resdag-cpu reservoirpy --report --out results/ci-latest.json

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: |
            benchmarks/results/REPORT.md
            benchmarks/results/ci-latest.json
          if-no-files-found: warn

  julia-protocol:
    # Real Julia correctness oracles share the benchmark opt-in policy. They do
    # not replace the existing CPU timing gates or claim comparative rankings.
    if: >-
      ${{ github.event_name == 'schedule'
          || github.event_name == 'workflow_dispatch'
          || (github.event_name == 'pull_request'
              && contains(github.event.pull_request.labels.*.name, 'benchmark')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RESDAG_TEST_JULIA: "1"
      RESDAG_JULIA_PROJECT: ${{ github.workspace }}/benchmarks/julia
      JULIA_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      JULIA_NUM_PRECOMPILE_TASKS: "1"
      JULIA_PKG_PRECOMPILE_AUTO: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-environment
        with:
          python-version: "3.12"

      - name: Read pinned Julia version
        id: julia-version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path("benchmarks/julia/Manifest.toml").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={manifest['julia_version']}", file=output)
          PY

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ steps.julia-version.outputs.version }}

      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-protocol-${{ steps.julia-version.outputs.version }}-${{ hashFiles('benchmarks/julia/Manifest.toml') }}
          # Fork pull requests need no cache-deletion permission.
          delete-old-caches: "false"

      - name: Instantiate pinned Julia environment
        run: |
          julia --startup-file=no --project=benchmarks/julia -e '
            using Pkg, LinearAlgebra
            BLAS.set_num_threads(1)
            Pkg.instantiate(; allow_autoprecomp=false, julia_version_strict=true)
            Pkg.precompile()
          '
          git diff --exit-code -- benchmarks/julia/Project.toml benchmarks/julia/Manifest.toml

      - name: Check real pinned Julia fit and autonomous forecast protocols
        run: pytest --no-cov -q tests/test_benchmark_julia_protocol.py
